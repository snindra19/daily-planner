<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Planner{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-boost="true" class="bg-stone-50 text-stone-900">
  <nav class="bg-white border-b border-stone-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
      <a href="/" class="font-medium hover:underline">Today</a>
      <a href="/tomorrow" class="font-medium hover:underline">Tomorrow</a>
      <a href="/approvals" class="hover:underline">Approvals</a>
      <a href="/profile" class="hover:underline">Profile</a>
      <a href="/learned" class="hover:underline">Learned</a>
      <a href="/activity" class="hover:underline">Activity</a>
      {% if mode %}
      <span class="ml-auto rounded-full px-2 py-0.5 text-xs {{ 'bg-amber-100 text-amber-900' if mode == 'unrestricted' else 'bg-stone-200 text-stone-800' }}">{{ mode | capitalize }}</span>
      {% endif %}
    </div>
  </nav>
  <main class="max-w-3xl mx-auto px-4 py-6 space-y-6">
    {% if msg %}<p class="rounded border border-amber-300 bg-amber-50 px-3 py-2 text-sm">{{ msg }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
